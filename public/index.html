    <style>
        /* 昼间模式 */
        :root {
            --text-ink: #1a1918;
            --text-dim: #8b8682;
            --text-ruby: #a09b96;
            --accent-red: #c03531;
            --watermark: rgba(0, 0, 0, 0.06);
            --ripple-color: rgba(139, 134, 130, 0.4);
        }

        /* 夜间模式 */
        body.dark-mode {
            --text-ink: #f5f2e9;
            --text-dim: #9aa0a6;
            --text-ruby: #7a8086;
            --accent-red: #e64a45;
            --watermark: rgba(255, 255, 255, 0.07);
            --ripple-color: rgba(245, 242, 233, 0.3);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            color: var(--text-ink);
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #fcfbf8;
            transition: background-color 1.5s ease-in-out;
        }

        .atmosphere {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #fcfbf8;
            transition: background-color 1.8s ease-in-out;
            z-index: 0; pointer-events: none;
        }

        .water-flow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='w'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.005 0.025' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23w)'/%3E%3C/svg%3E");
            background-size: 800px 800px;
            mix-blend-mode: soft-light; opacity: 0.45;
            animation: flowWater 40s linear infinite;
            pointer-events: none; z-index: 1;
            transition: opacity 1.5s ease-in-out;
        }
        body.dark-mode .water-flow { opacity: 0.15; }

        @keyframes flowWater {
            0% { background-position: 0px 0px; }
            100% { background-position: -800px 150px; }
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            mix-blend-mode: overlay; pointer-events: none; z-index: 100;
        }

        .line, .giant-keyword, .stamp, .date, .intro-title h1, .intro-title p, rt, .instruction, .copyright {
            transition: color 1.2s ease-in-out, border-color 1.2s ease-in-out, opacity 1s ease-in-out;
        }

        /* 引导文字 */
        .instruction {
            position: fixed; bottom: 40px; right: 40px;
            font-size: 0.8rem; letter-spacing: 0.2em; color: var(--text-dim);
            z-index: 50; display: flex; align-items: center; gap: 12px;
            animation: pulse 3s infinite ease-in-out; flex-direction: row-reverse;
        }
        .instruction::before { content: ''; width: 35px; height: 1px; background-color: var(--text-dim); }

        /* 版权信息 */
        .copyright {
            position: fixed; bottom: 40px; left: 40px;
            font-size: 0.75rem; letter-spacing: 0.1em; color: var(--text-dim);
            z-index: 50; font-family: 'Noto Serif JP', serif;
        }

        /* 音乐播放器样式 */
        .music-toggle {
            position: fixed; top: 40px; right: 40px;
            width: 32px; height: 32px;
            color: var(--text-dim);
            cursor: pointer; z-index: 50;
            transition: color 1.5s ease-in-out, opacity 0.3s;
            display: flex; justify-content: center; align-items: center;
        }
        .music-toggle:hover { opacity: 0.7; }
        .music-toggle svg { width: 22px; height: 22px; position: absolute; transition: opacity 0.3s; }
        .music-toggle .sound-on { opacity: 0; }
        .music-toggle .sound-off { opacity: 1; }
        .music-toggle.playing .sound-on { opacity: 1; }
        .music-toggle.playing .sound-off { opacity: 0; }
        body.dark-mode .music-toggle { color: var(--text-dim); }

        .scroll-track {
            display: flex; align-items: center; height: 100vh; width: max-content;
            padding: 0 50vw; box-sizing: border-box; position: absolute;
            right: 0; flex-direction: row-reverse; z-index: 10; will-change: transform;
        }

        .intro-title {
            writing-mode: vertical-rl; text-orientation: upright;
            display: flex; flex-direction: row-reverse; align-items: flex-start;
            gap: 2.5rem; height: 75vh; margin: 0 5vw; flex-shrink: 0;
            padding-top: 8vh;
            box-sizing: border-box;
        }

        /* 网站主标题 */
        .intro-title h1 { font-size: 3.5rem; font-weight: 400; letter-spacing: 0.4em; margin: 0; }
        .intro-title p { color: var(--text-dim); letter-spacing: 0.3em; margin: 0; font-size: 1rem; }

        .haiku-item {
            position: relative; height: 80vh; width: 450px;
            margin: 0 15vw; display: flex; justify-content: center;
            align-items: flex-start; padding-top: 8vh;
            flex-shrink: 0; will-change: transform; transform-origin: bottom center;
            box-sizing: border-box;
        }

        /* 呼吸动画大字 */
        .giant-keyword {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 55vh; font-weight: 800; color: var(--watermark);
            white-space: nowrap; z-index: -1; pointer-events: none; user-select: none;
            animation: breatheKanji 12s ease-in-out infinite;
        }

        @keyframes breatheKanji {
            0%, 100% { opacity: 0.25; transform: translate(-50%, -48%) scale(0.97); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
        }

        .poem-content {
            display: flex; flex-direction: row-reverse; gap: 3.8rem;
            z-index: 2; cursor: pointer; position: relative;
        }

        .line {
            writing-mode: vertical-rl; text-orientation: upright;
            font-size: 2.2rem; line-height: 1.1; letter-spacing: 0.5em;
            color: var(--text-ink); pointer-events: none; will-change: transform, filter;
        }

        ruby { ruby-position: over; ruby-align: center; }
        rt {
            font-size: 0.35em; color: var(--text-ruby);
            letter-spacing: 0.05em; font-family: 'Noto Serif JP', serif;
            font-weight: 300; transform: translateX(-0.15em);
        }

        .line.l1 { margin-top: 0; }
        .line.l2 { margin-top: 6rem; }
        .line.l3 { margin-top: 12rem; }

        .meta {
            position: absolute; bottom: 5vh; right: -30px;
            writing-mode: vertical-rl; text-orientation: upright;
            display: flex; align-items: center; gap: 20px; z-index: 3;
        }

        .date { color: var(--text-dim); font-size: 0.9rem; letter-spacing: 0.15em; }

        .stamp {
            color: var(--accent-red); font-size: 0.9rem; font-weight: 500;
            letter-spacing: 0.15em; border: 1.5px solid var(--accent-red);
            padding: 12px 6px; border-radius: 1px; font-family: 'Noto Serif JP', serif;
            white-space: nowrap; background-color: transparent;
        }

        .ripple-anim { animation: waterRipple 1s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

        @keyframes waterRipple {
            0% { transform: translate(0, 0) scale(1); filter: blur(0); }
            15% { transform: translate(-5px, 4px) skewY(-2.5deg) scale(1.04); filter: blur(1.5px); }
            40% { transform: translate(3px, -2px) skewY(1deg) scale(0.97); filter: blur(0); }
            100% { transform: translate(0, 0) scale(1); filter: blur(0); }
        }

        .click-ring {
            position: fixed; border: 2px solid var(--ripple-color);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: ringExpand 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 999; width: 30px; height: 30px;
        }

        @keyframes ringExpand {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 3px; }
            100% { transform: translate(-50%, -50%) scale(35); opacity: 0; border-width: 0px; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 0.8; transform: translateX(-5px); }
        }

        @media (max-width: 768px) {
            .haiku-item { width: 300px; margin: 0 15vw; padding-top: 10vh; }
            .line { font-size: 1.8rem; letter-spacing: 0.4em; }
            .poem-content { gap: 2.5rem; }
            .giant-keyword { font-size: 42vh; }
            .intro-title h1 { font-size: 2.8rem; }
            .line.l1 { margin-top: 0; }
            .line.l2 { margin-top: 4rem; }
            .line.l3 { margin-top: 8rem; }
            .instruction { bottom: 25px; right: 25px; }
            .copyright { bottom: 25px; left: 25px; }
        }
    </style>
</head>
<body>

<div class="atmosphere" id="atmosphere"></div>
<div class="water-flow"></div>
<div class="noise-overlay"></div>

<!-- 版权信息 -->
<div class="copyright">&copy; itsuki</div>

<!-- 音乐播放器 UI -->
<div class="music-toggle" id="music-toggle" title="音楽を再生/停止">
    <svg class="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
    <svg class="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
</div>

<!-- 海浪/环境音 -->
<audio id="bg-music" src="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg" loop preload="auto"></audio>

<div class="instruction" id="instruction">流れに身を任せ、あるいは左へ</div>

<div class="scroll-track" id="track">
    <div class="intro-title track-item" data-color="#fcfbf8" data-theme="light">
        <h1>春の余韻</h1>
        <p>四月・東京</p>
    </div>
</div>

<script>
    // ==========================================
    // 🌸 俳句数据：采用时光倒叙排列 (最新的日期在前)
    // ==========================================
    const haikuData = [
        // --- 新增：4.11 白猫 ---
        { date: "4.11", location: "見沼代親水公園", lines: ["<ruby>守<rt>まも</rt></ruby>り<ruby>神<rt>がみ</rt></ruby>", "<ruby>石<rt>いし</rt></ruby>に<ruby>居座<rt>いすわ</rt></ruby>る", "<ruby>白猫<rt>しろねこ</rt></ruby>よ"], keyword: "猫", bgColor: "#f4f5f7", theme: "light" },
        // --- 新增：4.11 万緑 ---
        { date: "4.11", location: "舎人公園", lines: ["<ruby>万緑<rt>ばんりょく</rt></ruby>や", "<ruby>文机<rt>ふづくえ</rt></ruby>にする", "<ruby>膝<rt>ひざ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>"], keyword: "緑", bgColor: "#eef5f0", theme: "light" },
        { date: "4.10", location: "舎人", lines: ["ざざという", "ドアの<ruby>向<rt>む</rt></ruby>こうの", "<ruby>遠<rt>とお</rt></ruby>い<ruby>風<rt>かぜ</rt></ruby>"], keyword: "遠", bgColor: "#e4e9ed", theme: "light" },
        { date: "4.9", location: "舎人公園", lines: ["<ruby>朝風<rt>あさかぜ</rt></ruby>や", "<ruby>光<rt>ひかり</rt></ruby>をこぼす", "<ruby>寒<rt>さむ</rt></ruby><ruby>温<rt>あたた</rt></ruby>め"], keyword: "朝", bgColor: "#fdf8ec", theme: "light" },
        { date: "4.8", location: "舎人公園", lines: ["<ruby>春<rt>はる</rt></ruby>の<ruby>午後<rt>ごご</rt></ruby>", "<ruby>止<rt>と</rt></ruby>まりて<ruby>長<rt>なが</rt></ruby>き", "<ruby>木椅子<rt>きいす</rt></ruby>かな"], keyword: "陽", bgColor: "#fdf5e6", theme: "light" },
        { date: "4.7", location: "日暮里", lines: ["<ruby>風<rt>かぜ</rt></ruby>となり", "<ruby>日暮里<rt>にっぽり</rt></ruby>を<ruby>飛<rt>と</rt></ruby>ぶ", "<ruby>木<rt>き</rt></ruby>の<ruby>葉<rt>は</rt></ruby>かな"], keyword: "葉", bgColor: "#eee3dc", theme: "light" },
        { date: "4.7", location: "赤門会学校", lines: ["<ruby>始業<rt>しぎょう</rt></ruby>の<ruby>音<rt>ね</rt></ruby>", "<ruby>桜<rt>さくら</rt></ruby>をくぐる", "<ruby>異邦人<rt>いほうじん</rt></ruby>"], keyword: "学", bgColor: "#eaf4fc", theme: "light" },
        { date: "4.6", location: "荒川土手", lines: ["<ruby>草<rt>くさ</rt></ruby>の<ruby>土手<rt>どて</rt></ruby>", "<ruby>風<rt>かぜ</rt></ruby>をハックす", "<ruby>白<rt>しろ</rt></ruby>きワンピ"], keyword: "草", bgColor: "#f5faf2", theme: "light" },
        { date: "4.6", location: "荒川土手", lines: ["<ruby>土手長<rt>どてなが</rt></ruby>し", "スケボーという", "<ruby>剣<rt>つるぎ</rt></ruby>かな"], keyword: "剣", bgColor: "#e8ebe9", theme: "light" },
        { date: "4.6", location: "江北緑地", lines: ["足音に", "驚いて飛ぶ", "春の鳥"], keyword: "鳥", bgColor: "#edf3e6", theme: "light" },
        { date: "4.6", location: "舎人駅", lines: ["春の風", "駅に我のみ", "残されし"], keyword: "残", bgColor: "#2c333a", theme: "dark" },
        { date: "4.6", location: "舎人", lines: ["<ruby>青嵐<rt>あおあらし</rt></ruby>", "ペダルにのせて", "飛ぶ如し"], keyword: "嵐", bgColor: "#e4f2f0", theme: "light" },
        { date: "4.6", location: "舎人公園", lines: ["ネモフィラや", "我も一匹", "蜂ならん"], keyword: "蜂", bgColor: "#e3eff8", theme: "light" },
        { date: "4.5", location: "舎人公園", lines: ["草の<ruby>香<rt>か</rt></ruby>や", "<ruby>舎人<rt>とねり</rt></ruby>の風に", "混じる声"], keyword: "風", bgColor: "#eef5ed", theme: "light" },
        { date: "4.4", location: "舎人", lines: ["<ruby>十年<rt>ととせ</rt></ruby><ruby>経<rt>へ</rt></ruby>て", "窓に満ちたる", "春の<ruby>光<rt>かげ</rt></ruby>"], keyword: "光", bgColor: "#fcf6e6", theme: "light" },
        { date: "4.3", location: "上野公園", lines: ["スローモーション", "雪な桜に", "溶ける朝"], keyword: "桜", bgColor: "#fbeaed", theme: "light" },
        { date: "4.2", location: "上野", lines: ["<ruby>夜長<rt>よなが</rt></ruby>かな", "湯気に溶けゆく", "迷い心"], keyword: "湯", bgColor: "#252122", theme: "dark" },
        { date: "4.2", location: "羽田", lines: ["春風や", "新天地なる", "同<ruby>じ<rt>・</rt></ruby>月"], keyword: "月", bgColor: "#161a23", theme: "dark" }
    ];

    const kanjiMap = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    function convertToKanji(numStr) {
        return numStr.split('').map(char => /[0-9]/.test(char) ? kanjiMap[parseInt(char)] : char).join('');
    }

    let lastInteractionTime = Date.now();
    let isHoveringPoem = false;
    const instruction = document.getElementById('instruction');
    const track = document.getElementById('track');
    const atmosphere = document.getElementById('atmosphere');

    // 暂停变量：用于诗句居中时停顿2秒
    let isAutoPaused = false;
    let autoPauseEndTime = 0;
    let lastCenteredItemIndex = -1;

    function recordInteraction() {
        lastInteractionTime = Date.now();
        isAutoPaused = false;
        if (instruction) instruction.style.opacity = '0.2';
    }

    function initGallery() {
        haikuData.forEach((data, index) => {
            const item = document.createElement('div');
            item.className = 'haiku-item physics-item track-item';
            item.dataset.color = data.bgColor;
            item.dataset.theme = data.theme;

            const giant = document.createElement('div');
            giant.className = 'giant-keyword';
            giant.innerText = data.keyword;
            // 错落有致的呼吸节奏
            giant.style.animationDelay = `${index * -2.7}s`;
            item.appendChild(giant);

            const content = document.createElement('div');
            content.className = 'poem-content';
            data.lines.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = `line l${i + 1}`;
                div.innerHTML = line;
                content.appendChild(div);
            });

            content.addEventListener('click', function(e) {
                recordInteraction();
                const ring = document.createElement('div');
                ring.className = 'click-ring';
                ring.style.left = e.clientX + 'px';
                ring.style.top = e.clientY + 'px';
                document.body.appendChild(ring);
                setTimeout(() => ring.remove(), 1000);

                const lines = this.querySelectorAll('.line');
                lines.forEach(line => {
                    const rect = line.getBoundingClientRect();
                    const dist = Math.hypot((rect.left + rect.width / 2) - e.clientX, (rect.top + rect.height / 2) - e.clientY);
                    line.style.animationDelay = `${dist * 2.2}ms`;
                    line.classList.remove('ripple-anim');
                    void line.offsetWidth;
                    line.classList.add('ripple-anim');
                });
            });

            content.addEventListener('mouseenter', () => { isHoveringPoem = true; recordInteraction(); });
            content.addEventListener('mouseleave', () => { isHoveringPoem = false; recordInteraction(); });

            item.appendChild(content);

            const meta = document.createElement('div');
            meta.className = 'meta';
            const dateParts = data.date.split('.');
            const dateDiv = document.createElement('div');
            dateDiv.className = 'date';
            dateDiv.innerText = `${convertToKanji(dateParts[0])}月${convertToKanji(dateParts[1])}日`;
            const stamp = document.createElement('div');
            stamp.className = 'stamp';
            stamp.innerText = data.location;
            meta.appendChild(dateDiv);
            meta.appendChild(stamp);
            item.appendChild(meta);

            track.appendChild(item);
        });
    }

    initGallery();

    const trackItems = document.querySelectorAll('.track-item');
    const items = document.querySelectorAll('.physics-item');

    let currentX = 0, targetX = 0, ease = 0.08, activeColor = "#fcfbf8", activeTheme = "light";
    let smoothedVelocity = 0;

    function getMaxScroll() {
        return Math.max(0, track.getBoundingClientRect().width - window.innerWidth);
    }

    window.addEventListener('wheel', (e) => {
        recordInteraction();
        targetX += e.deltaY * 1.3;
        targetX = Math.max(0, Math.min(targetX, getMaxScroll()));
    }, { passive: true });

    window.addEventListener('mousemove', recordInteraction, { passive: true });

    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
        recordInteraction();
        touchStartX = e.touches[0].clientX;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        recordInteraction();
        const touchX = e.touches[0].clientX;
        const diff = touchStartX - touchX;
        targetX += diff * 2.2;
        targetX = Math.max(0, Math.min(targetX, getMaxScroll()));
        touchStartX = touchX;
    }, { passive: true });

    const bgMusic = document.getElementById('bg-music');
    const musicToggle = document.getElementById('music-toggle');
    let musicStarted = false;

    musicToggle.addEventListener('click', () => {
        if (bgMusic.paused) {
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    musicToggle.classList.add('playing');
                    musicStarted = true;
                }).catch(err => console.log(err));
            }
        } else {
            bgMusic.pause();
            musicToggle.classList.remove('playing');
        }
    });

    const startMusicOnInteraction = () => {
        if (!musicStarted) {
            bgMusic.volume = 0.5;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    musicToggle.classList.add('playing');
                    musicStarted = true;
                }).catch(err => console.log("等待...", err));
            }
        }
        window.removeEventListener('click', startMusicOnInteraction);
        window.removeEventListener('wheel', startMusicOnInteraction);
        window.removeEventListener('touchstart', startMusicOnInteraction);
    };

    window.addEventListener('click', startMusicOnInteraction, { once: true });
    window.addEventListener('wheel', startMusicOnInteraction, { once: true });
    window.addEventListener('touchstart', startMusicOnInteraction, { once: true });

    function render() {
        const idleTime = Date.now() - lastInteractionTime;
        const maxScroll = getMaxScroll();
        const screenCenter = window.innerWidth / 2;

        if (isAutoPaused && Date.now() > autoPauseEndTime) {
            isAutoPaused = false;
        }

        let isAutoScrolling = false;
        const baseScrollSpeed = Math.max(0.6, window.innerWidth * 0.0008);

        if ((idleTime > 2500 && !isHoveringPoem) || (idleTime > 6000)) {
            if (!isAutoPaused && targetX < maxScroll) {
                targetX += baseScrollSpeed;
                isAutoScrolling = true;
                if (instruction) instruction.style.opacity = '0.6';
            }
        }

        trackItems.forEach((item, index) => {
            const rect = item.getBoundingClientRect();
            const expectedItemCenter = rect.left + rect.width / 2 + (targetX - currentX);
            const distToCenter = screenCenter - expectedItemCenter;

            if (Math.abs(distToCenter) > 60 && lastCenteredItemIndex === index) {
                lastCenteredItemIndex = -1;
            }

            if (isAutoScrolling && Math.abs(distToCenter) <= baseScrollSpeed * 1.5 && lastCenteredItemIndex !== index) {
                targetX += distToCenter;
                isAutoPaused = true;
                autoPauseEndTime = Date.now() + 2000;
                lastCenteredItemIndex = index;
            }
        });

        currentX += (targetX - currentX) * ease;

        let instantVelocity = targetX - currentX;
        smoothedVelocity += (instantVelocity - smoothedVelocity) * 0.1;

        if (track) track.style.transform = `translateX(${currentX}px)`;

        items.forEach((item) => {
            let skewY = smoothedVelocity * 0.035;
            skewY = Math.max(-15, Math.min(skewY, 15));
            item.style.transform = `skewY(${skewY}deg)`;
        });

        let closestItem = null, minDistance = Infinity;

        trackItems.forEach(item => {
            const rect = item.getBoundingClientRect();
            const dist = Math.abs(screenCenter - (rect.left + rect.width / 2));
            if (dist < minDistance) { minDistance = dist; closestItem = item; }
        });

        if (closestItem) {
            const targetColor = closestItem.dataset.color, targetTheme = closestItem.dataset.theme;
            if (targetColor && targetColor !== activeColor) {
                activeColor = targetColor;
                if (atmosphere) atmosphere.style.backgroundColor = activeColor;
            }
            if (targetTheme && targetTheme !== activeTheme) {
                activeTheme = targetTheme;
                if (activeTheme === 'dark') document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
            }
        }

        requestAnimationFrame(render);
    }

    render();
    window.addEventListener('resize', () => { targetX = Math.max(0, Math.min(targetX, getMaxScroll())); });
</script>

</body>
